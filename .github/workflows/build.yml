name: Build BtuNote

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  web:
    name: Web (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Tandai versi build
        run: sed -i "s/__BUILD__/${{ github.run_number }}/" web/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4

  apk:
    name: APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Salin aplikasi web ke APK
        run: |
          mkdir -p android/app/src/main/assets
          cp -r web android/app/src/main/assets/web

      # Kunci tanda tangan ada di repo (android/btunote.jks) supaya update APK bisa dipasang di atas versi lama.
      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: gPL5SYnfXLeGFXJvyb0wFJaP
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Bungkus APK
        run: |
          VERSION="0.1.${{ github.run_number }}"
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/BtuNote-v$VERSION.apk"
          (cd out && zip -j ../BtuNote.zip "BtuNote-v$VERSION.apk")
          cp "out/BtuNote-v$VERSION.apk" BtuNote.apk
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: BtuNote-v${{ env.VERSION }}
          path: out/*.apk

      - name: Pindahkan tag latest
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Rilis
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: BtuNote (terbaru)
          body: |
            Versi ${{ env.VERSION }} — commit ${{ github.sha }}
            Android: unduh **BtuNote.zip**, ekstrak, lalu pasang APK di dalamnya.
            PC/browser: buka https://brot1994.github.io/BtuNote/ (di Edge: menu ⋯ → Aplikasi → Instal BtuNote).
          files: |
            BtuNote.zip
            BtuNote.apk
          make_latest: true
